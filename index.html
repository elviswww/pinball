<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>復古霓虹街機彈珠台 - Retro Pinball Arcade</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700;900&family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    :root {
      --neon-cyan: #00f0ff;
      --neon-pink: #ff007f;
      --neon-yellow: #ffe600;
      --neon-green: #39ff14;
    }
    body {
      font-family: 'Chakra Petch', sans-serif;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }
    .font-arcade {
      font-family: 'Press Start 2P', monospace;
    }
    .neon-text-pink {
      color: var(--neon-pink);
      text-shadow: 0 0 10px rgba(255, 0, 127, 0.7), 0 0 20px rgba(255, 0, 127, 0.4);
    }
    .neon-text-cyan {
      color: var(--neon-cyan);
      text-shadow: 0 0 10px rgba(0, 240, 255, 0.7), 0 0 20px rgba(0, 240, 255, 0.4);
    }
    .neon-text-yellow {
      color: var(--neon-yellow);
      text-shadow: 0 0 10px rgba(255, 230, 0, 0.7), 0 0 20px rgba(255, 230, 0, 0.4);
    }
    .neon-box-cyan {
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.3), inset 0 0 10px rgba(0, 240, 255, 0.15);
      border-color: rgba(0, 240, 255, 0.6);
    }
    .neon-box-pink {
      box-shadow: 0 0 20px rgba(255, 0, 127, 0.35);
      border-color: var(--neon-pink);
    }
    .scanlines {
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
      background-size: 100% 4px;
      pointer-events: none;
    }
    canvas {
      display: block;
      width: 100%;
      height: auto;
      max-height: 80vh;
      border-radius: 12px;
      background: radial-gradient(circle at 50% 30%, #151833 0%, #080913 85%, #030408 100%);
    }
  </style>
</head>
<body class="bg-[#070810] text-[#e0e6ed] min-h-screen flex flex-col items-center justify-center p-2 sm:p-4">

  <!-- 主機台容器 -->
  <div class="relative w-full max-w-4xl bg-[#111322] border-2 border-[#2b3152] rounded-2xl p-3 sm:p-6 shadow-2xl neon-box-cyan flex flex-col lg:flex-row gap-6 items-center lg:items-start justify-center">
    
    <!-- 左側／中央：遊戲畫布區域 -->
    <div class="relative flex flex-col items-center">
      <div class="relative rounded-xl overflow-hidden border-4 border-[#1f2442] shadow-[0_0_30px_rgba(0,0,0,0.9)] bg-black">
        <canvas id="pinballCanvas" width="460" height="660"></canvas>
        <div class="scanlines absolute inset-0 z-10"></div>

        <!-- 遊戲開始 / 結束結算彈窗 -->
        <div id="gameModal" class="absolute inset-0 z-20 bg-[#070914]/90 backdrop-blur-md flex flex-col items-center justify-center p-6 text-center transition-all duration-300">
          <div class="text-xs text-cyan-400 tracking-widest font-arcade mb-2">ARCADE SYSTEM</div>
          <h2 id="modalTitle" class="text-3xl sm:text-4xl font-black neon-text-pink mb-2 tracking-wider">RETRO PINBALL</h2>
          <p id="modalSub" class="text-sm text-gray-300 mb-4">掌握彈板節奏 • 挑戰歷史最高分</p>
          
          <div class="bg-[#0e1124] border border-[#2b335c] rounded-xl p-4 w-full max-w-xs mb-6">
            <div class="text-xs text-gray-400 font-arcade mb-1">SCORE</div>
            <div id="modalScoreDisplay" class="text-3xl font-black neon-text-yellow tracking-wider">000000</div>
          </div>

          <button id="modalBtn" class="bg-gradient-to-r from-pink-600 to-purple-600 hover:from-pink-500 hover:to-purple-500 text-white font-bold py-3 px-8 rounded-lg text-lg tracking-widest shadow-[0_0_20px_rgba(255,0,127,0.5)] transform active:scale-95 transition-all">
            START GAME
          </button>
        </div>
      </div>

      <!-- 行動裝置觸控控制面板 -->
      <div class="w-full mt-3 grid grid-cols-3 gap-2 sm:hidden z-30">
        <button id="touchLeftBtn" class="bg-[#181c38] active:bg-[#00f0ff]/30 border border-[#00f0ff]/40 text-[#00f0ff] py-4 rounded-xl font-bold text-center active:scale-95 transition-all">
          <span class="block text-xl">◀ A</span>
          <span class="text-[10px] text-gray-400">左擋板</span>
        </button>
        <button id="touchLaunchBtn" class="bg-[#241530] active:bg-[#ff007f]/40 border border-[#ff007f]/40 text-[#ff007f] py-4 rounded-xl font-bold text-center active:scale-95 transition-all">
          <span class="block text-xl">🚀 SPACE</span>
          <span class="text-[10px] text-gray-400">蓄力發射</span>
        </button>
        <button id="touchRightBtn" class="bg-[#181c38] active:bg-[#00f0ff]/30 border border-[#00f0ff]/40 text-[#00f0ff] py-4 rounded-xl font-bold text-center active:scale-95 transition-all">
          <span class="block text-xl">D ▶</span>
          <span class="text-[10px] text-gray-400">右擋板</span>
        </button>
      </div>
    </div>

    <!-- 右側：資訊儀表板與控制器說明 -->
    <div class="w-full lg:w-72 flex flex-col justify-between gap-4">
      <div class="space-y-3">
        <!-- 標題與音效按鈕 -->
        <div class="flex items-center justify-between pb-2 border-b border-[#252c4e]">
          <div class="font-arcade text-xs text-pink-400">PINBALL 1984</div>
          <button id="audioToggleBtn" class="text-xs bg-[#1a1f3d] px-2.5 py-1 rounded text-cyan-300 border border-cyan-500/30 hover:bg-[#252c56] transition-colors">
            🔊 音效: 開
          </button>
        </div>

        <!-- 歷史最高紀錄 (LocalStorage) -->
        <div class="bg-[#0b0d1a] border border-[#23294c] rounded-xl p-3.5 relative overflow-hidden">
          <div class="flex justify-between items-center mb-1">
            <span class="text-[11px] font-arcade text-yellow-400 flex items-center gap-1.5">
              <span>🏆</span> HIGH SCORE
            </span>
            <button id="resetScoreBtn" title="重置最高分" class="text-[10px] text-gray-500 hover:text-red-400 transition-colors">重設</button>
          </div>
          <div id="highScoreText" class="text-2xl sm:text-3xl font-black neon-text-yellow font-arcade tracking-wider">000000</div>
        </div>

        <!-- 當前分數 -->
        <div class="bg-[#0b0d1a] border border-[#23294c] rounded-xl p-3.5">
          <div class="text-[11px] font-arcade text-cyan-400 mb-1 flex items-center gap-1.5">
            <span>⚡</span> CURRENT SCORE
          </div>
          <div id="currentScoreText" class="text-2xl sm:text-3xl font-black neon-text-cyan font-arcade tracking-wider">000000</div>
        </div>

        <!-- 剩餘球數 -->
        <div class="bg-[#0b0d1a] border border-[#23294c] rounded-xl p-3">
          <div class="text-xs text-gray-400 font-bold mb-2">BALLS REMAINING</div>
          <div class="flex items-center gap-3">
            <div id="ballIndicator" class="flex gap-2">
              <span class="w-4 h-4 rounded-full bg-cyan-400 shadow-[0_0_8px_#00f0ff]"></span>
              <span class="w-4 h-4 rounded-full bg-cyan-400 shadow-[0_0_8px_#00f0ff]"></span>
              <span class="w-4 h-4 rounded-full bg-cyan-400 shadow-[0_0_8px_#00f0ff]"></span>
            </div>
            <span id="ballsCountText" class="text-sm font-bold text-gray-300">3 / 3</span>
          </div>
        </div>

        <!-- 發射蓄力能量條 -->
        <div class="bg-[#0b0d1a] border border-[#23294c] rounded-xl p-3">
          <div class="flex justify-between text-xs text-gray-400 font-bold mb-1.5">
            <span>PLUNGER POWER</span>
            <span id="powerPercentText" class="text-pink-400">0%</span>
          </div>
          <div class="w-full bg-[#1b2038] h-3.5 rounded-full overflow-hidden p-0.5 border border-[#303861]">
            <div id="plungerBarFill" class="h-full bg-gradient-to-r from-cyan-400 via-yellow-400 to-pink-500 rounded-full w-0 transition-all duration-75"></div>
          </div>
        </div>
      </div>

      <!-- 快捷防卡按鈕與按鍵指引 -->
      <div class="space-y-3 pt-2">
        <button id="nudgeBtn" class="w-full py-2 bg-[#1b213d] hover:bg-[#28325e] border border-yellow-500/40 text-yellow-300 text-xs font-bold rounded-lg transition-all flex items-center justify-center gap-2 active:scale-95 shadow-md">
          <span>💥 搖晃機台防卡 (NUDGE)</span>
        </button>

        <div class="bg-[#0a0c17] border border-[#1e233d] rounded-xl p-3 text-xs text-gray-400 space-y-1.5 leading-relaxed hidden sm:block">
          <div class="font-bold text-gray-300 text-[11px] mb-1">🎮 鍵盤控制指引：</div>
          <div><kbd class="px-1.5 py-0.5 bg-[#1d223a] text-cyan-300 rounded border border-[#37406c]">A</kbd> 或 <kbd class="px-1.5 py-0.5 bg-[#1d223a] text-cyan-300 rounded border border-[#37406c]">←</kbd> ：左拍板</div>
          <div><kbd class="px-1.5 py-0.5 bg-[#1d223a] text-cyan-300 rounded border border-[#37406c]">D</kbd> 或 <kbd class="px-1.5 py-0.5 bg-[#1d223a] text-cyan-300 rounded border border-[#37406c]">→</kbd> ：右拍板</div>
          <div><kbd class="px-1.5 py-0.5 bg-[#1d223a] text-pink-300 rounded border border-[#37406c]">Space</kbd> ：長按蓄力發射</div>
          <div><kbd class="px-1.5 py-0.5 bg-[#1d223a] text-yellow-300 rounded border border-[#37406c]">N</kbd> ：防卡微推 (Nudge)</div>
        </div>
      </div>

    </div>
  </div>

  <script>
    // Web Audio API 晶片音效合成器（零外部資源依賴）
    let audioCtx = null;
    let audioEnabled = true;

    function initAudio() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContext();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playTone(freq, type, duration, gain = 0.1) {
      if (!audioEnabled) return;
      try {
        initAudio();
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gainNode.gain.setValueAtTime(gain, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {
        // 音頻被封鎖或未授權時保持靜音
      }
    }

    const SoundFX = {
      bumper: () => {
        playTone(520, 'triangle', 0.12, 0.15);
        setTimeout(() => playTone(780, 'sine', 0.08, 0.1), 30);
      },
      flipper: () => playTone(240, 'square', 0.05, 0.08),
      launch: () => {
        playTone(280, 'sawtooth', 0.18, 0.15);
        setTimeout(() => playTone(560, 'sine', 0.22, 0.12), 60);
      },
      nudge: () => playTone(120, 'square', 0.1, 0.15),
      drain: () => {
        playTone(330, 'sawtooth', 0.15, 0.15);
        setTimeout(() => playTone(180, 'sawtooth', 0.35, 0.18), 120);
      },
      highScore: () => {
        const notes = [523, 659, 784, 1046];
        notes.forEach((freq, idx) => {
          setTimeout(() => playTone(freq, 'triangle', 0.2, 0.2), idx * 100);
        });
      }
    };

    const canvas = document.getElementById('pinballCanvas');
    const ctx = canvas.getContext('2d');

    const currentScoreText = document.getElementById('currentScoreText');
    const highScoreText = document.getElementById('highScoreText');
    const ballsCountText = document.getElementById('ballsCountText');
    const ballIndicator = document.getElementById('ballIndicator');
    const plungerBarFill = document.getElementById('plungerBarFill');
    const powerPercentText = document.getElementById('powerPercentText');
    const gameModal = document.getElementById('gameModal');
    const modalTitle = document.getElementById('modalTitle');
    const modalSub = document.getElementById('modalSub');
    const modalScoreDisplay = document.getElementById('modalScoreDisplay');
    const modalBtn = document.getElementById('modalBtn');
    const resetScoreBtn = document.getElementById('resetScoreBtn');
    const audioToggleBtn = document.getElementById('audioToggleBtn');
    const nudgeBtn = document.getElementById('nudgeBtn');

    // LocalStorage 安全存取與防禦
    const STORAGE_KEY = 'retro_pinball_highscore_val';
    function loadHighScore() {
      try {
        const val = parseInt(localStorage.getItem(STORAGE_KEY), 10);
        return (!isNaN(val) && val >= 0) ? val : 0;
      } catch (err) {
        return 0;
      }
    }

    function saveHighScore(score) {
      try {
        localStorage.setItem(STORAGE_KEY, score.toString());
      } catch (err) {
        console.warn('LocalStorage error:', err);
      }
    }

    let highScore = loadHighScore();
    highScoreText.textContent = highScore.toString().padStart(6, '0');

    resetScoreBtn.addEventListener('click', () => {
      saveHighScore(0);
      highScore = 0;
      highScoreText.textContent = '000000';
    });

    audioToggleBtn.addEventListener('click', () => {
      audioEnabled = !audioEnabled;
      audioToggleBtn.textContent = audioEnabled ? '🔊 音效: 開' : '🔈 音效: 關';
      if (audioEnabled) initAudio();
    });

    const GRAVITY = 0.23;
    const RESTITUTION = 0.72;
    const SUB_STEPS = 8;
    const PLUNGER_MAX_POWER = 60;

    let gameState = 'MENU'; // 'MENU' | 'WAIT_LAUNCH' | 'PLAYING' | 'GAME_OVER'
    let score = 0;
    let ballsLeft = 3;
    let chargeTime = 0;
    let isCharging = false;
    let stuckFramesCounter = 0;
    let tableShake = { x: 0, y: 0, decay: 0.85 };

    // 彈珠本體
    const ball = {
      x: 425,
      y: 590,
      vx: 0,
      vy: 0,
      radius: 8.5,
      color: '#ffffff',
      inPlay: false
    };

    // 障礙緩衝球（Bumpers）
    const bumpers = [
      { x: 155, y: 190, r: 25, score: 300, color: '#ff007f', flash: 0 },
      { x: 275, y: 190, r: 25, score: 300, color: '#ff007f', flash: 0 },
      { x: 215, y: 265, r: 30, score: 500, color: '#00f0ff', flash: 0 },
      { x: 140, y: 350, r: 18, score: 200, color: '#ffe600', flash: 0 },
      { x: 285, y: 350, r: 18, score: 200, color: '#ffe600', flash: 0 }
    ];

    // 火花粒子陣列
    const particles = [];
    function spawnSparks(x, y, color, count = 8) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const spd = 1.5 + Math.random() * 4;
        particles.push({
          x, y,
          vx: Math.cos(angle) * spd,
          vy: Math.sin(angle) * spd,
          life: 1.0,
          color: color
        });
      }
    }

    // 牆體線段集合
    const segments = [
      // 外側輪廓（左壁與頂部流線）
      { x1: 25, y1: 650, x2: 25, y2: 140 },
      { x1: 25, y1: 140, x2: 120, y2: 30 },
      { x1: 120, y1: 30, x2: 340, y2: 30 },
      { x1: 340, y1: 30, x2: 445, y2: 135 },
      { x1: 445, y1: 135, x2: 445, y2: 650 },

      // 發射通道左側分隔牆（經典全開放式，無任何擋門）
      { x1: 405, y1: 650, x2: 405, y2: 190 },
      { x1: 405, y1: 190, x2: 375, y2: 130 },

      // 導流斜板（通向下方的拍板側）
      { x1: 25, y1: 460, x2: 120, y2: 530 },
      { x1: 405, y1: 460, x2: 305, y2: 530 },

      // 頂部回彈側板
      { x1: 70, y1: 100, x2: 120, y2: 140 },
      { x1: 355, y1: 100, x2: 305, y2: 140 }
    ];

    class Flipper {
      constructor(pivotX, pivotY, length, isLeft) {
        this.pivotX = pivotX;
        this.pivotY = pivotY;
        this.length = length;
        this.isLeft = isLeft;
        this.restAngle = isLeft ? 0.48 : Math.PI - 0.48;
        this.activeAngle = isLeft ? -0.42 : Math.PI + 0.42;
        this.angle = this.restAngle;
        this.angularVel = 0;
        this.prevAngle = this.angle;
      }

      update(isActive) {
        this.prevAngle = this.angle;
        const target = isActive ? this.activeAngle : this.restAngle;
        const diff = target - this.angle;
        this.angularVel = diff * 0.48; // 反應靈敏度
        this.angle += this.angularVel;
      }

      getTip() {
        return {
          x: this.pivotX + Math.cos(this.angle) * this.length,
          y: this.pivotY + Math.sin(this.angle) * this.length
        };
      }

      draw() {
        const tip = this.getTip();
        ctx.save();
        ctx.lineWidth = 11;
        ctx.lineCap = 'round';
        ctx.strokeStyle = this.isLeft ? '#00f0ff' : '#ff007f';
        ctx.shadowColor = ctx.strokeStyle;
        ctx.shadowBlur = 14;

        ctx.beginPath();
        ctx.moveTo(this.pivotX, this.pivotY);
        ctx.lineTo(tip.x, tip.y);
        ctx.stroke();

        // 樞紐裝飾
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(this.pivotX, this.pivotY, 6, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    const leftFlipper = new Flipper(120, 530, 80, true);
    const rightFlipper = new Flipper(305, 530, 80, false);

    const keys = { left: false, right: false, space: false };

    window.addEventListener('keydown', (e) => {
      if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) {
        e.preventDefault();
      }
      initAudio();

      if (e.code === 'KeyA' || e.code === 'ArrowLeft') {
        if (!keys.left) SoundFX.flipper();
        keys.left = true;
      }
      if (e.code === 'KeyD' || e.code === 'ArrowRight') {
        if (!keys.right) SoundFX.flipper();
        keys.right = true;
      }
      if (e.code === 'Space') {
        if (!keys.space && gameState === 'WAIT_LAUNCH') {
          isCharging = true;
        }
        keys.space = true;
      }
      if (e.code === 'KeyN') {
        triggerNudge();
      }
    });

    window.addEventListener('keyup', (e) => {
      if (e.code === 'KeyA' || e.code === 'ArrowLeft') keys.left = false;
      if (e.code === 'KeyD' || e.code === 'ArrowRight') keys.right = false;
      if (e.code === 'Space') {
        if (gameState === 'WAIT_LAUNCH' && isCharging) {
          launchPlunger();
        }
        keys.space = false;
        isCharging = false;
        chargeTime = 0;
        updatePlungerUI(0);
      }
    });

    // 觸控按鍵綁定
    const touchLeftBtn = document.getElementById('touchLeftBtn');
    const touchRightBtn = document.getElementById('touchRightBtn');
    const touchLaunchBtn = document.getElementById('touchLaunchBtn');

    function bindTouch(btn, onDown, onUp) {
      btn.addEventListener('touchstart', (e) => { e.preventDefault(); initAudio(); onDown(); });
      btn.addEventListener('touchend', (e) => { e.preventDefault(); onUp(); });
      btn.addEventListener('mousedown', () => { initAudio(); onDown(); });
      btn.addEventListener('mouseup', () => { onUp(); });
      btn.addEventListener('mouseleave', () => { onUp(); });
    }

    bindTouch(touchLeftBtn, () => { keys.left = true; SoundFX.flipper(); }, () => { keys.left = false; });
    bindTouch(touchRightBtn, () => { keys.right = true; SoundFX.flipper(); }, () => { keys.right = false; });
    bindTouch(touchLaunchBtn, 
      () => { if (gameState === 'WAIT_LAUNCH') isCharging = true; keys.space = true; }, 
      () => { 
        if (gameState === 'WAIT_LAUNCH' && isCharging) launchPlunger();
        keys.space = false;
        isCharging = false;
        chargeTime = 0;
        updatePlungerUI(0);
      }
    );

    nudgeBtn.addEventListener('click', () => {
      initAudio();
      triggerNudge();
    });

    function triggerNudge() {
      if (gameState !== 'PLAYING') return;
      tableShake.x = (Math.random() - 0.5) * 12;
      tableShake.y = -6;
      ball.vx += (Math.random() - 0.5) * 4;
      ball.vy -= 3;
      SoundFX.nudge();
      spawnSparks(ball.x, ball.y, '#ffe600', 6);
    }

    function updatePlungerUI(ratio) {
      const pct = Math.round(ratio * 100);
      plungerBarFill.style.width = `${pct}%`;
      powerPercentText.textContent = `${pct}%`;
    }

    function startNewGame() {
      initAudio();
      score = 0;
      ballsLeft = 3;
      currentScoreText.textContent = '000000';
      updateBallUI();
      gameModal.classList.add('hidden');
      setupNextBall();
    }

    function setupNextBall() {
      ball.x = 425;
      ball.y = 590;
      ball.vx = 0;
      ball.vy = 0;
      ball.inPlay = false;
      gameState = 'WAIT_LAUNCH';
      stuckFramesCounter = 0;
    }

    function launchPlunger() {
      const power = Math.max(0.2, Math.min(chargeTime / PLUNGER_MAX_POWER, 1.0));
      ball.vy = -(15 + power * 17);
      ball.vx = (Math.random() - 0.5) * 0.8;
      ball.inPlay = true;
      gameState = 'PLAYING';
      SoundFX.launch();
      spawnSparks(ball.x, ball.y, '#ffe600', 12);
    }

    function updateBallUI() {
      ballsCountText.textContent = `${ballsLeft} / 3`;
      const indicators = ballIndicator.querySelectorAll('span');
      indicators.forEach((ind, i) => {
        if (i < ballsLeft) {
          ind.className = 'w-4 h-4 rounded-full bg-cyan-400 shadow-[0_0_8px_#00f0ff]';
        } else {
          ind.className = 'w-4 h-4 rounded-full bg-gray-700';
        }
      });
    }

    function handleBallLoss() {
      SoundFX.drain();
      ballsLeft--;
      updateBallUI();

      if (ballsLeft > 0) {
        setupNextBall();
      } else {
        triggerGameOver();
      }
    }

    function triggerGameOver() {
      gameState = 'GAME_OVER';
      const isNewRecord = score > highScore;
      if (isNewRecord) {
        highScore = score;
        saveHighScore(highScore);
        highScoreText.textContent = highScore.toString().padStart(6, '0');
        SoundFX.highScore();
      }

      modalTitle.textContent = isNewRecord ? 'NEW HIGH SCORE!' : 'GAME OVER';
      modalTitle.className = isNewRecord ? 'text-3xl sm:text-4xl font-black neon-text-yellow mb-2 tracking-wider' : 'text-3xl sm:text-4xl font-black neon-text-pink mb-2 tracking-wider';
      modalSub.textContent = isNewRecord ? '太厲害了！創造了全新歷史紀錄！' : '3 顆球已耗盡，再來一局吧！';
      modalScoreDisplay.textContent = score.toString().padStart(6, '0');
      modalBtn.textContent = 'PLAY AGAIN';
      gameModal.classList.remove('hidden');
    }

    modalBtn.addEventListener('click', () => {
      startNewGame();
    });

    function closestPointOnSeg(px, py, x1, y1, x2, y2) {
      const dx = x2 - x1;
      const dy = y2 - y1;
      const lenSq = dx * dx + dy * dy;
      if (lenSq === 0) return { x: x1, y: y1, t: 0 };
      let t = ((px - x1) * dx + (py - y1) * dy) / lenSq;
      t = Math.max(0, Math.min(1, t));
      return { x: x1 + t * dx, y: y1 + t * dy, t };
    }

    function physicsSubStep(dt) {
      if (gameState !== 'PLAYING') return;

      // 重力與位移
      ball.vy += GRAVITY * dt;
      ball.x += ball.vx * dt;
      ball.y += ball.vy * dt;

      // 線段碰撞判定
      for (const seg of segments) {
        const pt = closestPointOnSeg(ball.x, ball.y, seg.x1, seg.y1, seg.x2, seg.y2);
        const dx = ball.x - pt.x;
        const dy = ball.y - pt.y;
        const dist = Math.hypot(dx, dy);

        if (dist < ball.radius) {
          const nx = dx / (dist || 1);
          const ny = dy / (dist || 1);
          ball.x = pt.x + nx * ball.radius;
          ball.y = pt.y + ny * ball.radius;

          const dot = ball.vx * nx + ball.vy * ny;
          if (dot < 0) {
            ball.vx = (ball.vx - 2 * dot * nx) * RESTITUTION;
            ball.vy = (ball.vy - 2 * dot * ny) * RESTITUTION;
          }
        }
      }

      // 圓形緩衝球碰撞
      for (const b of bumpers) {
        const dx = ball.x - b.x;
        const dy = ball.y - b.y;
        const dist = Math.hypot(dx, dy);
        const minDist = ball.radius + b.r;

        if (dist < minDist) {
          const nx = dx / (dist || 1);
          const ny = dy / (dist || 1);
          ball.x = b.x + nx * minDist;
          ball.y = b.y + ny * minDist;

          const dot = ball.vx * nx + ball.vy * ny;
          const bounceImpulse = 11.5;
          ball.vx = (ball.vx - 2 * dot * nx) * 0.7 + nx * bounceImpulse;
          ball.vy = (ball.vy - 2 * dot * ny) * 0.7 + ny * bounceImpulse;

          b.flash = 12;
          score += b.score;
          currentScoreText.textContent = score.toString().padStart(6, '0');
          SoundFX.bumper();
          spawnSparks(b.x, b.y, b.color, 10);
        }
      }

      // 左右動態拍板碰撞
      [leftFlipper, rightFlipper].forEach(f => {
        const tip = f.getTip();
        const pt = closestPointOnSeg(ball.x, ball.y, f.pivotX, f.pivotY, tip.x, tip.y);
        const dx = ball.x - pt.x;
        const dy = ball.y - pt.y;
        const dist = Math.hypot(dx, dy);

        if (dist < ball.radius + 4) {
          const nx = dx / (dist || 1);
          const ny = dy / (dist || 1);
          ball.x = pt.x + nx * (ball.radius + 4);
          ball.y = pt.y + ny * (ball.radius + 4);

          // 拍板角動量傳遞
          const rotSpeed = (f.angle - f.prevAngle) / dt;
          const armLen = pt.t * f.length;
          const flipperVy = rotSpeed * armLen * Math.cos(f.angle);
          const flipperVx = -rotSpeed * armLen * Math.sin(f.angle);

          const relVx = ball.vx - flipperVx;
          const relVy = ball.vy - flipperVy;
          const dot = relVx * nx + relVy * ny;

          if (dot < 0) {
            ball.vx = (relVx - 2 * dot * nx) * 0.75 + flipperVx;
            ball.vy = (relVy - 2 * dot * ny) * 0.75 + flipperVy;

            score += 50;
            currentScoreText.textContent = score.toString().padStart(6, '0');
            spawnSparks(ball.x, ball.y, f.isLeft ? '#00f0ff' : '#ff007f', 6);
          }
        }
      });

      // 自動防卡機制（Anti-stuck 微震）
      if (Math.hypot(ball.vx, ball.vy) < 0.25 && ball.y < 520) {
        stuckFramesCounter++;
        if (stuckFramesCounter > 120) {
          ball.vx += (Math.random() - 0.5) * 6;
          ball.vy -= 4;
          stuckFramesCounter = 0;
          spawnSparks(ball.x, ball.y, '#39ff14', 8);
        }
      } else {
        stuckFramesCounter = 0;
      }

      // 球落入排水底槽（Drain）
      if (ball.y > canvas.height + 25) {
        ball.inPlay = false;
        handleBallLoss();
      }
    }

    function update() {
      // 蓄力長按判定
      if (isCharging && gameState === 'WAIT_LAUNCH') {
        chargeTime = Math.min(chargeTime + 1, PLUNGER_MAX_POWER);
        updatePlungerUI(chargeTime / PLUNGER_MAX_POWER);
      }

      // 更新拍板物理
      leftFlipper.update(keys.left);
      rightFlipper.update(keys.right);

      // 子步迭代運算，保證高初速時絕不穿牆
      const dt = 1 / SUB_STEPS;
      for (let s = 0; s < SUB_STEPS; s++) {
        physicsSubStep(dt);
      }

      // 衰減搖台震動
      tableShake.x *= tableShake.decay;
      tableShake.y *= tableShake.decay;

      // 更新火花粒子
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.04;
        if (p.life <= 0) particles.splice(i, 1);
      }
    }

    function draw() {
      ctx.save();
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.translate(tableShake.x, tableShake.y);

      // 背景復古透視網格
      ctx.strokeStyle = 'rgba(25, 30, 65, 0.4)';
      ctx.lineWidth = 1;
      for (let x = 0; x < canvas.width; x += 35) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, canvas.height);
        ctx.stroke();
      }
      for (let y = 0; y < canvas.height; y += 35) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y);
        ctx.stroke();
      }

      // 繪製靜態牆面與引流槽
      ctx.lineWidth = 4;
      ctx.strokeStyle = '#273461';
      ctx.shadowColor = '#00f0ff';
      ctx.shadowBlur = 6;
      for (const seg of segments) {
        ctx.beginPath();
        ctx.moveTo(seg.x1, seg.y1);
        ctx.lineTo(seg.x2, seg.y2);
        ctx.stroke();
      }

      // 彈簧發射井壓縮視覺
      if (gameState === 'WAIT_LAUNCH') {
        const springCompress = Math.min(chargeTime * 0.4, 25);
        ctx.strokeStyle = '#ffe600';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(415, 630);
        ctx.lineTo(438, 630 + springCompress);
        ctx.stroke();
      }

      // 緩衝球 Bumpers
      bumpers.forEach(b => {
        ctx.save();
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        ctx.fillStyle = b.color;
        ctx.shadowColor = b.color;
        ctx.shadowBlur = b.flash > 0 ? b.flash * 3 : 10;
        ctx.fill();

        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r * 0.6, 0, Math.PI * 2);
        ctx.stroke();

        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 11px Chakra Petch';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(b.score, b.x, b.y);
        ctx.restore();

        if (b.flash > 0) b.flash--;
      });

      // 拍板 Flippers
      leftFlipper.draw();
      rightFlipper.draw();

      // 火花特效粒子
      particles.forEach(p => {
        ctx.save();
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.fillStyle = p.color;
        ctx.shadowColor = p.color;
        ctx.shadowBlur = 6;
        ctx.fillRect(p.x, p.y, 3, 3);
        ctx.restore();
      });

      // 彈珠繪製
      if (ball.y < canvas.height + 20) {
        ctx.save();
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
        ctx.fillStyle = ball.color;
        ctx.shadowColor = '#ffffff';
        ctx.shadowBlur = 12;
        ctx.fill();

        // 彈珠高光金屬質感
        ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
        ctx.beginPath();
        ctx.arc(ball.x - 2.5, ball.y - 2.5, ball.radius * 0.35, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      ctx.restore();
    }

    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    window.onload = function() {
      requestAnimationFrame(gameLoop);
    };
  </script>
</body>
</html>
